name: Build iOS App

on:
  push:
    branches: [ main ]
    tags: [ 'ios-v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    # Xcode 16 (bundled with macos-15) can open the project format that the
    # latest XcodeGen generates (objectVersion 77); macos-14/Xcode 15 cannot.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen --spec project.yml

      - name: Build unsigned app
        run: |
          xcodebuild -project PhotoTrans.xcodeproj -scheme PhotoTrans -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1

      - name: Package IPA
        run: |
          mkdir -p build/ipa/Payload
          APP_PATH=$(find build -name "PhotoTrans.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: PhotoTrans.app not found!"
            find build -type d 2>/dev/null
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa && zip -r ../../PhotoTrans-unsigned.ipa Payload

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/ios-v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          echo "Creating release for tag: $TAG"
          API_JSON=$(printf '{"tag_name":"%s","target_commitish":"main","name":"%s","body":"PhotoTrans iOS App (unsigned) - %s\\n\\nNote: .app inside zip, needs side-loading with developer certificate","draft":false,"prerelease":false}' "$TAG" "$TAG" "$TAG")
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/releases \
            -d "$API_JSON")
          RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id')
          echo "Release ID: $RELEASE_ID"
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/zip" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=PhotoTrans-iOS-v1.0.0.ipa" \
            --data-binary @PhotoTrans-unsigned.ipa

      - name: Upload IPA artifact
        if: "!startsWith(github.ref, 'refs/tags/ios-v')"
        uses: actions/upload-artifact@v4
        with:
          name: PhotoTrans-unsigned-ipa
          path: PhotoTrans-unsigned.ipa
          retention-days: 14