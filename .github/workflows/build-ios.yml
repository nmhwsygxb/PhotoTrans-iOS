name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen --spec project.yml

      - name: Debug - list project files
        run: |
          ls -la
          find . -name "*.xcodeproj" -type d 2>/dev/null || echo "No .xcodeproj"

      - name: Build unsigned app
        run: |
          xcodebuild -project PhotoTrans.xcodeproj -alltargets -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1

      - name: Package IPA
        run: |
          mkdir -p build/ipa/Payload
          APP_PATH=$(find build -name "PhotoTrans.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: PhotoTrans.app not found!"
            find build -type d 2>/dev/null
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa && zip -r ../../PhotoTrans-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PhotoTrans-unsigned-ipa
          path: PhotoTrans-unsigned.ipa
          retention-days: 14