name: PhotoTrans
options:
  bundleIdPrefix: com.phototrans
  deploymentTarget:
    # NavigationStack / LabeledContent used by the UI require iOS 16+.
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  PhotoTrans:
    type: application
    platform: iOS
    sources:
      - PhotoTrans
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phototrans.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PhotoTrans/Info.plist
        CODE_SIGNING_ALLOWED: NO
schemes:
  PhotoTrans:
    build:
      targets:
        PhotoTrans: all