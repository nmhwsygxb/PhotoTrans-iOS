name: PhotoTrans
options:
  bundleIdPrefix: com.phototrans
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  # Generate an old project format that Xcode 15 (macos-14 runner) can open.
  # Newer XcodeGen defaults to Xcode 16 format (objectVersion 77) which
  # fails with "future Xcode project file format (77)".
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  PhotoTrans:
    type: application
    platform: iOS
    sources:
      - PhotoTrans
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phototrans.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PhotoTrans/Info.plist
        CODE_SIGNING_ALLOWED: NO
schemes:
  PhotoTrans:
    build:
      targets:
        PhotoTrans: all